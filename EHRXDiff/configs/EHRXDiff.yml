context_dim: 768
max_event_len: 1024
model:
  base_learning_rate: 5.0e-05
  target: cheff.ldm.models.diffusion.ddpm_tab.LatentDiffusion
  params:
    linear_start: 0.0015
    linear_end: 0.0295
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    first_stage_key: target_img
    cond_stage_key: table, prev_img
    image_size: 64
    channels: 3 
    cond_stage_trainable: true
    conditioning_key: crossattn
    monitor: val/loss_simple_ema
    scale_factor: 0.18215
    use_ema: true
    load_ema: false

    unet_config:
      target: cheff.ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        image_size: 64
        in_channels: 3 # 3 + 3 (for concat input)
        out_channels: 3
        model_channels: 224
        attention_resolutions:
        - 8
        - 4
        - 2
        num_res_blocks: 2
        channel_mult:
        - 1
        - 2
        - 4
        - 4
        num_heads: 8
        use_spatial_transformer: true
        transformer_depth: 1
        context_dim: ${context_dim}
        use_checkpoint: true
        legacy: False

    first_stage_config:
      target: cheff.ldm.models.autoencoder.AutoencoderKL
      params:
        embed_dim: 3
        ckpt_path: trained_models/cheff_autoencoder.pt
        ddconfig:
          double_z: True
          z_channels: 3
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
          - 1
          - 2
          - 4
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity

    cond_stage_config:
      target: cheff.ldm.modules.encoders.modules.MultiModalTransformerAdaptor
      params:
        autoencoder_config: ${model.params.first_stage_config.params}
        clip_visual_enc_config:
          input_resolution: 256
          layers: 12
          width: 768
          patch_size: 32
          heads: 12   # 768 // 64
        clip_enc_checkpoint: "trained_models/clip_vit32_256_1024.ckpt"
        context_dim: ${context_dim}
        condition_feat_dim: 1024
        clip_trainable: true
            
data:
  target: CustomDataModuleFromConfig
  params:
    batch_size: 8
    img_root_dir: ./re256
    img_meta_dir: ./mimic-cxr-jpg/2.0.0/
    tab_root_dir: ../data_preprocessing/db_processing/data
    tab_data_type: openai_filtered
    max_event_len: ${max_event_len}
    num_workers: 16
    data_aug: false
    use_openai_emb: true
    debug: false

lightning:
  callbacks:
    image_logger:
      target: scripts.01_train_ldm.ImageLogger
      params:
        batch_frequency: 5000
        max_images: 8
        increase_log_steps: False

  trainer:
    gpus: 2
    benchmark: False
    accumulate_grad_batches: 8
    amp_backend: apex
    check_val_every_n_epoch: 2